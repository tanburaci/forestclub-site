# Forest Club Urla · www.forestcluburla.com. Ana sayfa arama motorlarına açık; paneller, dekont ve form sayfaları ve tasarım
# parçaları (sayfalar/) kapalı (X-Robots-Tag aşağıda).
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Sayfa betikleri derlenmiş dosyalardan (sayfalar/*.dc.js) gelir: eval yok, satır içi betik yok
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://gflabqnazkstsyafzdmn.supabase.co wss://gflabqnazkstsyafzdmn.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/uye"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/uye/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/yonetim"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/yonetim/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dekont"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/dekont/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/form"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/form/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/sayfalar/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
