<!-- YAKINDA KAPAĞI: site görünür ve kaydırılır ama hiçbir yeri tıklanmaz, klavyeyle de ulaşılmaz (#kok inert);
     tıklananlar karttaki Instagram ve sözleşme bağlantıları (WhatsApp numaraları açılışa kadar görünmez).
     Yönetim › İletişim › Site durumu'nda "Yakında" modu kapatılınca site.js kapağı kaldırır; ayar okunamazsa kapak kalır. -->
<style id="fc-yakinda-stil">
#fc-yakinda{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:transparent}
/* Ayar okunana kadar kapak görünmez (site açıkken 1-2 sn kapak yanıp sönmesin); site.js "Yakında" açıksa ya da ayar
   okunamazsa gösterir, kapalıysa kaldırır. Bu arada açılmamış bölümler yine gizli, site yine tıklanmaz */
#fc-yakinda:not(.goster){visibility:hidden}
#fc-yakinda .kart{max-width:440px;width:100%;box-sizing:border-box;background:#FFFFFF;border:3px solid #111111;border-radius:18px;box-shadow:6px 6px 0 #111111;padding:26px 24px;text-align:center;font:16px Figtree,sans-serif;color:#111111;transform:rotate(-1.5deg)}
#fc-yakinda h1{font-family:'Amatic SC',cursive;font-weight:700;font-size:56px;line-height:1;margin:0 0 10px}
#fc-yakinda p{margin:0 0 16px;line-height:1.5;color:#3A3A3A}
#fc-yakinda .ig{display:inline-flex;align-items:center;justify-content:center;width:56px;height:56px;color:#FFFFFF;background:#111111;border:2.5px solid #111111;border-radius:50%;text-decoration:none}
#fc-yakinda .ig:hover{background:#FFFFFF;color:#111111}
#fc-yakinda .alt{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;justify-content:center;padding:10px 16px;background:#FFFFFF;border-top:2px solid #111111;font:13px Figtree,sans-serif}
#fc-yakinda .yasal{display:flex;flex-wrap:wrap;gap:0 12px;justify-content:center}
#fc-yakinda .yasal a{color:#3A3A3A;display:inline-block;padding:6px 2px}
#fc-yakinda .logo img{display:block;height:22px;width:auto;max-width:100%}
@media (max-width:480px){#fc-yakinda h1{font-size:44px}}
/* Kart alttaki şeridin üstünde kalsın */
#fc-yakinda{padding-bottom:96px}
/* Sitenin en altı şeridin arkasında kalmasın: sayfa sonuna şerit kadar boşluk (kapak kalkınca bu stil de kalkar) */
body{padding-bottom:48px}
@media (max-width:799px){body{padding-bottom:76px}}
@media (max-width:489px){body{padding-bottom:103px}}
@media (max-height:520px){body{padding-bottom:0}}
/* Yatay telefonda kart ekrana sığmıyordu: kapak kendi içinde kayar, kart üstten başlar; şerit kartın altına */
@media (max-height:520px){#fc-yakinda{padding-bottom:16px;flex-direction:column;align-items:center;justify-content:flex-start;overflow-y:auto}#fc-yakinda .alt{position:static;margin-top:16px;width:100%;box-sizing:border-box}}
/* Tasarımdan kalan "Örnek duyuru" şeridi açılışa kadar gizli (gerçek duyuru yönetim panelinden gelecek) */
#kok [role="alert"][style*="F6C945"]{display:none !important}
/* Açılışa kadar yalnız ilk ekran ve "Biz Kimiz?" görünür ("Biz Kimiz?" etkinliklerin altında): etkinlikler, fiyatlar, üyelik, başvuru, SSS ve alt bilgi gizli */
#kok #bulusmalar, #kok #bulusmalar ~ *:not(#kulup){display:none !important}
/* "Biz Kimiz?" kartlarından fiyat söyleyen ("üyelere %50 indirim") */
#kok #kulup div[style*="grid-template-columns: repeat(2"] > div:nth-child(3){display:none !important}
/* Üst menüde yalnız "Biz Kimiz?" kalır (diğerleri gizli bölümlere götürür; üye girişi açılışta) */
#kok nav .fs-menu:not([href="#kulup"]), #kok nav .fs-uye-giris{display:none !important}
/* Kapak dururken "Yakında açılıyoruz" şeridi de gizli (kapak aynı şeyi söylüyor) */
#kok .fs-yakinda-serit{display:none !important}
/* "Biz Kimiz?" bölümündeki "WhatsApp'tan yaz" düğmesi de açılışa kadar gizli (kapakta yalnız Instagram) */
#kok .fs-wa-yaz{display:none !important}
